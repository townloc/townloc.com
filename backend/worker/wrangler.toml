name = "townloc"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# Site + API on the same Worker:
#   townloc.com          → static website
#   townloc.com/api/...  → API
routes = [
  { pattern = "townloc.com", custom_domain = true },
  { pattern = "www.townloc.com", custom_domain = true },
]

[assets]
directory = "../.."
binding = "ASSETS"
# Worker runs first so www→apex redirect and /api both work.
run_worker_first = true
# Serve root 404.html for unknown static paths (SEO-friendly not-found page).
not_found_handling = "404-page"

[vars]
# Comma-separated browser origins allowed to call the API.
# Local preview + GitHub Pages are included by default.
ALLOWED_ORIGINS = "http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:8787,http://localhost:8787,https://shamratx.github.io,https://townloc.com,https://www.townloc.com"

# Zoho mailboxes (full send/receive). Change anytime → npm run deploy
# Roles: contact=leads | hello=general | support=clients | marketing=campaigns
RECIPIENT_EMAIL = "contact@townloc.com"
# Requires townloc.com verified in Resend (SPF/DKIM). Zoho MX stays for receiving.
SENDER_EMAIL = "townloc <contact@townloc.com>"

# RESEND_API_KEY is stored as a secret (not in this file).
# Set it with:  npx wrangler secret put RESEND_API_KEY
#
# Admin CMS secrets (required for /admin):
#   npx wrangler secret put ADMIN_PASSWORD
#   npx wrangler secret put ADMIN_SECRET
#   npx wrangler secret put GITHUB_TOKEN   (optional — needed to publish pages to repo)
#
# GitHub publish (optional vars)
GITHUB_REPO = ""
GITHUB_BRANCH = "main"

[[d1_databases]]
binding = "DB"
database_name = "townloc-leads"
database_id = "3a1b3aa8-af01-42d7-9da2-f4de2c2ca16d"
migrations_dir = "migrations"
