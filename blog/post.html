  <script src="../assets/site.js"></script>
  <script>
    (function () {
      var API = "";
      var params = new URLSearchParams(location.search);
      var slug = params.get("slug") || "";
      var err = document.getElementById("post-error");
      if (!slug) {
        err.textContent = "Missing post slug.";
        err.classList.remove("hidden");
        return;
      }
      fetch(API + "/api/posts/" + encodeURIComponent(slug))
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (res) {
          if (!res.ok || !res.d.post) throw new Error((res.d && res.d.message) || "Not found");
          var p = res.d.post;
          document.title = p.title + " | GglMap Blog";
          document.getElementById("post-title").textContent = p.title;
          document.getElementById("post-date").textContent = p.updated_at || "";
          document.getElementById("post-body").innerHTML = p.body || "";
        })
        .catch(function (e) {
          err.textContent = e.message || "Could not load post.";
          err.classList.remove("hidden");
        });
    })();
  </script>
